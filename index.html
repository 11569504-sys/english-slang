function renderList(){
 const arr=filtered(); $("list").innerHTML="";
 if(!arr.length){$("list").innerHTML='<div class="empty">找不到符合的俚語，試試其他關鍵字。</div>';return}
 arr.forEach(d=>{
  const b=document.createElement("button");b.className="idiom-btn"+(selected&&selected.idiom===d.idiom?" active":"");
  const strong=document.createElement("strong");strong.textContent=d.idiom;
  const span=document.createElement("span");span.textContent=d.meaning;
  b.append(strong,span);b.onclick=()=>choose(d);$("list").appendChild(b);
 });
}
function choose(d){selected=d;answered=false;renderList();renderDetail()}
function renderDetail(){
 if(!selected)return;const d=selected;
 $("detail").innerHTML=`
 <span class="tag">俚語學習卡</span><div class="section"><h2 style="font-size:27px;margin-bottom:5px">${escapeHtml(d.idiom)}</h2><div class="meaning">${escapeHtml(d.meaning)}</div></div>
 <div class="section"><div class="section-title"><span class="icon">💬</span><h2>英文例句</h2></div><div class="example">${escapeHtml(d.example)}</div></div>
 <div class="section"><div class="section-title"><span class="icon">🎨</span><h2>三格漫畫分鏡</h2></div><div class="comic">${d.panels.map((p,i)=>`<div class="frame"><div class="frame-top">第 ${i+1} 格</div><div class="frame-body">${escapeHtml(p)}</div></div>`).join("")}</div><div class="note">這裡提供漫畫分鏡文字，方便老師或學生後續搭配插圖製作漫畫。</div></div>
 <div class="section"><div class="section-title"><span class="icon">🧠</span><h2>複習小測驗</h2></div><div class="quiz"><p>${escapeHtml(d.question)}</p><div class="options">${d.options.map((o,i)=>`<button class="option" data-choice="${i}">${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`).join("")}</div><div id="feedback" class="feedback" aria-live="polite"></div><button class="soft" id="retry" style="margin-top:10px">重新作答</button></div></div>
 <div class="section"><div class="section-title"><span class="icon">🍎</span><h2>教師教學建議</h2></div><div class="teacher">${escapeHtml(d.teacher)}</div></div>`;
 document.querySelectorAll("[data-choice]").forEach(btn=>btn.onclick=()=>answer(Number(btn.dataset.choice)));
 $("retry").onclick=()=>{answered=false;document.querySelectorAll("[data-choice]").forEach(b=>b.classList.remove("correct","wrong"));$("feedback").textContent=""};
}
function answer(i){
 if(answered)return;answered=true;const d=selected;
 document.querySelectorAll("[data-choice]").forEach((b,j)=>{if(j===d.answer)b.classList.add("correct");else if(j===i)b.classList.add("wrong")});
 $("feedback").textContent=i===d.answer?"答對了！太棒了！ 🎉 "+d.meaning:"再想一想！正確答案是「"+d.options[d.answer]+"」。 "+d.meaning;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("search").addEventListener("input",renderList);$("filter").addEventListener("change",renderList);
$("random").onclick=()=>{const arr=filtered();if(arr.length)choose(arr[Math.floor(Math.random()*arr.length)]);else{$("search").value="";renderList();choose(data[Math.floor(Math.random()*data.length)])}};
renderList();
</script>
</body>
</html>
